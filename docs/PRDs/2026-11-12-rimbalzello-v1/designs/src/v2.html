<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 16px;flex-shrink:0}
.hdr .t{font-size:17px;font-weight:600}
.bpm{font-size:15px;display:flex;align-items:center;gap:6px}
.bpm .v{border-bottom:1px dashed #757575}
.pm{color:#ababab;font-size:18px;padding:0 6px}
.stop{font-style:italic;text-decoration:underline;text-underline-offset:4px;margin-left:6px}
.stepsb{padding:6px 16px 2px;flex-shrink:0}
.lane .lab{display:inline-block;min-width:26px}
.foot{text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#757575;padding:2px 0 10px;flex-shrink:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.grid2 .lbl{width:52px;font-size:14px}.grid2 .val{display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(26,28,27,.55)}
.overlay span{background:#ffd866;color:#000;font-size:20px;font-style:italic;padding:14px 22px}
.sub{font-size:13px;color:#ababab;font-style:italic;margin-left:auto;align-self:center}
.tap{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid #3a3d3c;font-style:italic;margin-top:6px}
</style></head><body><div id="root"></div>
<script src="common.js"></script>
<script>
const q=new URLSearchParams(location.search);const v=q.get('v'),W=+q.get('w'),H=+q.get('h');
const R=document.getElementById('root');
const MIXm=[['bd',63,C.bd],['sd',50,C.sd,true],['hh',78,C.hh]];
function rowsH(list){const d=document.createElement('div');rows(d,list.map(r=>[r[0],r[1],r[2]]));return d.innerHTML;}
function stepsH(size,lh){const d=document.createElement('div');steps(d,size);
  d.querySelectorAll('.lane').forEach((l,i)=>{l.style.lineHeight=lh||'1.45';const lab=l.firstChild;lab.className='lab';
    if(i===1){lab.innerHTML='<span style="text-decoration:line-through;color:#757575">sd</span> ';[...l.children].slice(1).forEach(c=>{c.style.color=c.style.background?c.style.color:'#4a4d4c'});}});
  return d.innerHTML;}
const hdr=(h=52)=>`<div class="hdr" style="height:${h}px"><div class="t"><span class="dim">#</span> rimbalzello</div><div class="bpm"><span class="pm">−</span><span class="v">128</span><span class="dim">bpm</span><span class="pm">+</span><span class="stop">stop</span></div></div>`;
const pad=(inner='')=>`<div class="pad" style="flex-grow:1"><div class="vx"></div><div class="hz"></div><div class="ring"></div><div class="dot"></div>
 <div style="position:absolute;left:34%;top:55%;margin:12px 0 0 12px;font-size:12px;color:#ababab">x 087 · y 148</div>${inner}</div>`;
const loop=()=>`<div class="loop" style="height:48px"><span class="lbl">loop</span><div class="boxes" style="height:40px"><span>1/4</span><span class="on">1/8</span><span>1/16</span><span>1/32</span></div></div>`;
const bottom=(first='→ sound')=>`<div class="bottom" style="padding:4px 16px 6px"><span><span style="color:#757575">${first.slice(0,2)}</span>${first.slice(2)}</span><span class="anc">set anchor</span><span class="ret">↺ return on bar</span></div>`;
const foot=()=>`<div class="foot">// help &nbsp;&nbsp; // about &nbsp;&nbsp; // source</div>`;
const tabs=(a,b,c)=>`<div class="tabs">${a}${b||''}${c||''}</div>`;

let mid='',padInner='',stepsInPad=false,hh=52;
if(v==='phone'){mid=loop()+tabs('<span class="on">mix</span>','<span>fx</span>')+rowsH(MIXm);}
if(v==='compact'){hh=44;stepsInPad=true;mid=loop()+tabs('<span class="on">mix</span>','<span>fx</span>')+rowsH(MIXm);}
if(v==='sound'){mid=loop()+tabs('<span class="on" style="color:#ffd866;border-color:#ffd866">bd</span>','<span>sd</span><span>hh</span>','<span class="sub">bass drum</span>')+`<div class="grid2">${rowsH([['freq',50,C.bd],['punch',61,C.bd],['tone',46,C.bd],['decay',58,C.bd],['level',70,C.bd]])}</div>`;}
if(v==='tempo'){mid=loop()+`<div style="padding-top:6px"><h2 style="font-size:15px;font-weight:600;height:28px"><span class="dim">## </span>tempo</h2>${rowsH([['bpm',51,C.w],['swing',24,C.w]]).replace('>51<','>128<').replace('>24<','>56%<')}<div class="tap">tap tempo</div></div>`;}
if(v==='taptoplay'){mid=loop()+tabs('<span class="on">mix</span>','<span>fx</span>')+rowsH(MIXm);padInner='<div class="overlay"><span>▶ tap to play</span></div>';}
if(v==='help'){mid=loop()+tabs('<span class="on">mix</span>','<span>fx</span>')+rowsH(MIXm);
 padInner=`<div style="position:absolute;left:10px;right:10px;bottom:8px;font-size:12px;line-height:1.5;color:#ababab;background:rgba(26,28,27,.9);padding:6px 8px;border:1px solid #3a3d3c">tap: jump · drag: glide · two-finger tap: undo<br>double-tap + slide: fine · tap bd sd hh: mute<br>anchor: set, noodle, return on bar · loop: hold</div>`;}

if(['phone','compact','sound','tempo','taptoplay','help'].includes(v)){
  const st=stepsH(stepsInPad?13:14,stepsInPad?'1.3':'1.4');
  if(stepsInPad) padInner+=`<div class="steps-ov">${st}</div>`;
  R.innerHTML=`<div class="screen" style="width:${W}px;height:${H}px">${hdr(hh)}${pad(padInner)}${stepsInPad?'':`<div class="stepsb">${st}</div>`}<div style="padding:0 16px">${mid}</div>${bottom(v==='sound'||v==='tempo'?'← play':'→ sound')}${v==='compact'?'':foot()}</div>`;
  if(v==='help') R.innerHTML=R.innerHTML.replace('// help','<span style="color:#fff">// help</span>');
  if(v==='compact') R.querySelector('.screen').insertAdjacentHTML('beforeend',foot());
}

if(v==='tablet'){
  const drum=(n,list)=>`<div><h2 style="color:${C[n]};font-size:15px;font-weight:600;height:30px"><span class="dim">## </span>${n}</h2>${rowsH(list.map(([p,x])=>[p,x,C[n]]))}</div>`;
  R.innerHTML=`<div class="screen" style="width:${W}px;height:${H}px">${hdr()}
  <div style="flex-grow:1;display:flex;flex-direction:column;gap:14px;padding:0 20px;min-height:0">
   <div style="flex-grow:1;display:flex;min-height:0">${pad()}</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:28px;flex-shrink:0">
   <div style="min-width:0">
    <div style="padding:2px 0 8px">${stepsH(15,'1.45')}</div>
    ${rowsH([['bd',63,C.bd],['sd',50,C.sd,true],['hh',78,C.hh],['chaos',34,C.w],['drift',22,C.w],['drive',40,C.drive]])}
   </div><div style="min-width:0">
    ${loop()}
    ${tabs('<span class="on" style="color:#ffd866;border-color:#ffd866">bd</span>','<span>sd</span><span>hh</span>','<span class="sub">bass drum</span>')}
    ${rowsH([['freq',50,C.bd],['punch',61,C.bd],['tone',46,C.bd],['decay',58,C.bd],['level',70,C.bd]])}
   </div></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px"><span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#757575">// help &nbsp; // about &nbsp; // source</span>
   <span style="display:flex;gap:20px;align-items:center;font-style:italic"><span class="anc">set anchor</span><span class="ret" style="background:#ffd866;color:#000;padding:8px 10px">↺ return on bar</span></span></div></div>`;
}
</script></body></html>
